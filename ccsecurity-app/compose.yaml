services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - sail
        depends_on:
            mariadb:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M
    mariadb:
        image: 'mariadb:11'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            - './docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh'
            - './docker/sql:/docker-entrypoint-initdb.d/sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M
    caddy:
        image: 'caddy:latest'
        ports:
            - '443:443'
        volumes:
            - './docker/Caddyfile:/etc/caddy/Caddyfile'
        networks:
            - sail
        depends_on:
            - laravel.test
        deploy:
            resources:
                limits:
                    memory: 128M
                reservations:
                    memory: 64M
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
