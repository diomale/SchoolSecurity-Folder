; CCSS custom performance settings for the dev container
; The app runs on the PHP built-in server (CLI SAPI), where opcache
; is disabled by default. Enabling it massively speeds up requests
; when the project is bind-mounted on Docker Desktop (Windows).
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.max_accelerated_files=20000
opcache.memory_consumption=128
